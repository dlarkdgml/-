const SV=[c=>`<path d="M8 36L4 18L24 28Z" fill="${c}"/><path d="M4 36L30 26L96 24L117 33L104 41H10Z" fill="url(#h0)"/><path d="M44 26L58 13H80L91 25Z" fill="#bdf" opacity=".85"/><path d="M60 14L56 25" stroke="#fff" opacity=".6"/><path d="M12 35L108 31" stroke="#fff" stroke-width="1.5" opacity=".8"/><path d="M16 38L100 36" stroke="#0ff" stroke-width="1"/><circle cx="6" cy="37" r="3" fill="#0ff"/>`,
c=>`<path d="M6 32H113L100 42H16Z" fill="url(#h1)"/><rect x="18" y="22" width="80" height="10" rx="2" fill="#f4f8ff"/>${[...Array(11)].map((_,i)=>`<rect x="22" y="25" width="4" height="3" fill="#39f" transform="translate(${i*6.7} 0)"/>`).join('')}<rect x="30" y="14" width="52" height="8" rx="2" fill="#e6eefc"/>${[...Array(7)].map((_,i)=>`<rect x="34" y="16.5" width="4" height="3" fill="#39f" transform="translate(${i*6.5} 0)"/>`).join('')}<rect x="62" y="7" width="18" height="7" fill="#cde"/><rect x="38" y="3" width="9" height="11" fill="${c}"/><rect x="38" y="6" width="9" height="2" fill="#fff"/><path d="M10 34H110" stroke="#fff" stroke-width="1.5"/><path d="M92 14V4M90 6H94" stroke="#ccc"/>`,
c=>`<path d="M2 34L16 28H100L118 33L106 41H8Z" fill="url(#h2)"/><path d="M36 28L42 17H74L80 28Z" fill="#8a97a6"/><rect x="48" y="10" width="18" height="7" fill="#6f7c8b"/><path d="M57 10V2" stroke="#ccc" stroke-width="1.5"/><circle cx="57" cy="5" r="3" fill="#ddd"/><path d="M50 6H64" stroke="#ccc"/><rect x="84" y="23" width="10" height="5" fill="#5b6672"/><path d="M94 25H112" stroke="#444" stroke-width="2"/><rect x="18" y="24" width="10" height="4" fill="#5b6672"/><path d="M28 26H38" stroke="#444" stroke-width="2"/>${[...Array(4)].map((_,i)=>`<rect x="${52+i*6}" y="21" width="4" height="4" fill="#333"/>`).join('')}<rect x="6" y="29" width="8" height="2" fill="#bbb"/><path d="M12 36H108" stroke="#cc3" stroke-width="1"/>`,
c=>`<path d="M2 38Q42 24 118 31Q108 41 60 41Z" fill="url(#h3)"/><path d="M44 30Q60 14 82 28Z" fill="#bdf" opacity=".85"/><path d="M52 28Q62 20 74 27" stroke="#fff" fill="none"/><path d="M4 38L2 26H12L16 34Z" fill="${c}"/><path d="M20 36Q60 28 112 32" stroke="#fff" stroke-width="2" fill="none"/><path d="M112 33L119 34L110 38M100 40L116 41" stroke="#fff" fill="none"/>`,
c=>`<path d="M6 30H110L116 36H12Z" fill="url(#h4)"/><path d="M10 38H112L118 43H16Z" fill="url(#h4)" opacity=".8"/><rect x="14" y="26" width="92" height="5" fill="#cfe"/><rect x="34" y="14" width="44" height="12" rx="5" fill="#dff" opacity=".9"/><path d="M40 20H72" stroke="#39f" stroke-width="3"/><circle cx="56" cy="12" r="4" fill="#fff"/><circle cx="56" cy="12" r="2" fill="#0ff"/><path d="M86 26V12L94 26" fill="${c}"/><path d="M12 34H108" stroke="#0ff" stroke-width="1.5"/><circle cx="10" cy="40" r="2.5" fill="#0ff"/>`];
const svg=d=>`<svg viewBox="0 0 120 48"><defs><linearGradient id="h${d}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${COL[d]}"/><stop offset="1" stop-color="#012"/></linearGradient></defs>${SV[d](COL[d])}${WL}</svg>`;
const HZ=[{n:'폭풍우',d:'파도와 강풍으로 속도가 크게 줄어듭니다.',m:.5,t:[4,6],c:''},{n:'해일성 큰 파도',d:'거대한 파도로 일시적으로 거의 정지합니다.',m:.06,t:[2,2.5],c:''},{n:'짙은 해무',d:'시야 불량으로 항해 속도가 감소합니다.',m:.6,t:[4,6],c:'fog'},{n:'강한 역방향 해류',d:'진행 방향 반대 해류로 속도가 줄어듭니다.',m:.4,t:[4,5],c:''},{n:'부유 빙산 경보',d:'충돌 위험으로 일시 정지합니다.',m:.04,t:[2,2.5],c:'ice'}];
let M,R,prev='ready',pts=+localStorage.getItem('oceanPts')||0,cat='전체';
const rnd=n=>Math.floor(Math.random()*n),shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.remove('on'));$('#'+id).classList.add('on');}
function upPts(){$('#tp').textContent=pts.toLocaleString()}
function newMatch(){const ds=shuf([0,1,2,3,4]),cs=shuf(CITY).slice(0,4);
 M={ships:ds.map((d,i)=>({i,d,name:i?cs[i-1]:$('#pname').value||'나의 선박',pref:rnd(21),player:i==0})),offer:shuf([...Array(21).keys()]).slice(0,3),sel:null,open:null};renderReady()}
function det(f){return `<h3>${f.n} <span class="fm">${f.f}</span></h3><p><i>분류:</i> ${f.c} · ${f.s=='상용'?'실제 활용 중':f.s=='시범'?'시범·실증 단계':'연구 단계'}</p><p><i>화학적 특징:</i> ${f.a}</p><p><i>장점:</i> ${f.p}</p><p><i>단점·주의:</i> ${f.d}</p><p><i>활용 현황:</i> ${f.u}</p><p><i>선박 연료 특징:</i> ${f.h}</p>`}
function renderReady(){const p=M.ships[0];$('#pship').innerHTML=`<div style="width:220px;margin:auto">${svg(p.d)}</div><b>${p.name}</b> <span class="tag">PLAYER</span>`;
 $('#plist').innerHTML=M.ships.map(s=>`<div class="sl ${s.player?'me':''}">${svg(s.d)}<b>${s.name}</b>${s.player?'<span class="tag">PLAYER</span>':''}</div>`).join('');
 $('#offer').innerHTML=M.offer.map(i=>`<div class="fc ${M.sel===i?'sel':''}" data-i="${i}"><b>${FD[i].n}</b> <span class="fm">${FD[i].f}</span><div style="font-size:12px;color:#8cd">${FD[i].c} · ${FD[i].s}</div></div>`).join('');
 if(M.open!=null)$('#od').innerHTML=det(FD[M.open]);else $('#od').textContent='연료 카드를 누르면 선택되고 상세 설명이 나옵니다.';
 $('#go').disabled=M.sel==null;upPts()}
$('#offer').onclick=e=>{const c=e.target.closest('.fc');if(!c)return;M.open=M.sel=+c.dataset.i;renderReady()};

$('#pname').oninput=e=>{M.ships[0].name=e.target.value||'나의 선박';renderReady()};
function startRace(){if(M.sel==null||R&&R.run)return;
 const ships=M.ships.map(s=>{const f=s.player?M.sel:rnd(21),fd=FD[f],pf=FD[s.pref];
  let fit=f==s.pref?1.1:fd.c==pf.c?1.03:.97;fit*=.93+Math.random()*.14;
  return{...s,fuel:f,fit,pos:0,fin:0,em:1,ev:Math.random()}});
 R={ships,t:0,run:true,order:[],hz:{lane:rnd(5),start:2+Math.random()*4,type:rnd(5),on:0,shown:0},paid:false};
 $('#lanes').innerHTML=ships.map((s,i)=>`<div class="lane ${s.player?'me2':''}" id="l${i}"><span class="nm">${i+1}번 ${s.name}${s.player?' ★PLAYER':''}</span><span class="km"></span><div class="wk"></div><div class="sh">${svg(s.d)}</div><div class="fl"></div></div>`).join('');
 $('#ban').style.display='none';show('race');let last=performance.now();
 const loop=n=>{if(!R.run)return;let dt=Math.min((n-last)/1000,.1);last=n;R.t+=dt;tick(dt);if(R.run)requestAnimationFrame(loop)};requestAnimationFrame(loop)}
function tick(dt){const h=R.hz,H=HZ[h.type];
 if(!h.shown&&R.t>=h.start){h.shown=1;h.on=1;h.end=R.t+H.t[0]+Math.random()*(H.t[1]-H.t[0]);const s=R.ships[h.lane];
  const b=$('#ban');b.style.display='block';b.innerHTML=`⚠️ <b>${H.n}</b> 발생! — ${H.d}<br>발생 경로: <b>${h.lane+1}번</b> · 영향 선박: <b>${s.name}</b> · 예상 지속: 약 ${Math.round(h.end-R.t)}초`;
  const l=$('#l'+h.lane);l.classList.add('hz');if(H.c)l.classList.add(H.c);document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),700)}
 if(h.on&&R.t>=h.end){h.on=0;const l=$('#l'+h.lane);l.className='lane'+(R.ships[h.lane].player?' me2':'');$('#ban').innerHTML+='<br>✅ 재해가 종료되었습니다.'}
 R.ships.forEach((s,i)=>{if(s.fin)return;s.ev-=dt;if(s.ev<=0){const r=Math.random(),ok=s.fuel==s.pref;s.em=r<(ok?.3:.2)?1.5:r<.45?.55:1;s.ev=.8+Math.random()*1.5}
  let m=s.fit*s.em*(1+(Math.random()-.5)*.12)*(R.t>14?1+(R.t-14)*.6:1);if(h.on&&h.lane==i)m*=H.m;
  s.pos+=.85*m*dt;if(s.pos>=10){s.pos=10;s.fin=R.t;R.order.push(s)}
  const l=$('#l'+i);const sh=l.querySelector('.sh');sh.classList.toggle('bo',s.em>1&&!s.fin);sh.style.left=(s.pos/10*86)+'%';l.querySelector('.wk').style.width=(s.pos/10*86+3)+'%';l.querySelector('.km').textContent=(s.em>1&&!s.fin?'⚡BOOST ':'')+(s.fin?'🏁 도착 '+s.fin.toFixed(1)+'초':`${s.pos.toFixed(2)}km / 남은 ${(10-s.pos).toFixed(2)}km`)});
 const rk=R.ships.slice().sort((a,b)=>(b.fin?1e3-b.fin:b.pos)-(a.fin?1e3-a.fin:a.pos));
 $('#rank').innerHTML='📊 '+rk.map((s,i)=>`${i+1}위 ${s.player?'<b style="color:#fc4">'+s.name+'</b>':s.name}`).join(' · ');$('#rt').textContent=R.t.toFixed(1)+'초';
 if(R.order.length==5){R.run=false;setTimeout(finish,800)}}
function finish(){if(R.paid)return;R.paid=true;const o=R.order,pr=o.findIndex(s=>s.player)+1,g=[0,10000,5000,2000][pr]||0;pts+=g;localStorage.setItem('oceanPts',pts);
 $('#rsum').innerHTML=`당신의 순위: <b style="color:#fc4;font-size:30px">${pr}위</b> · 획득 <b>${g.toLocaleString()}P</b> · 내 포인트 <b>${pts.toLocaleString()}P</b>`;
 $('#rtab').innerHTML='<tr><th>순위</th><th>선박</th><th>이름</th><th>연료</th><th>기록</th></tr>'+o.map((s,i)=>`<tr class="${s.player?'me':''}"><td>${i+1}위</td><td>${svg(s.d)}</td><td>${s.name}${s.player?' <span class="tag">PLAYER</span>':''}</td><td>${FD[s.fuel].n}</td><td>${s.fin.toFixed(1)}초</td></tr>`).join('');upPts();show('res')}
$('#go').onclick=startRace;
$('#again').onclick=()=>{M.ships[0].name=$('#pname').value||'나의 선박';newMatch();show('ready')};
$('#back').onclick=()=>{M.sel=null;renderReady();show('ready')};
function openDex(from){prev=from;renderDex();show('dex')}
$('#dexb').onclick=()=>openDex('ready');$('#dex2').onclick=()=>openDex('res');$('#dback').onclick=()=>show(prev);
function renderDex(){const cs=['전체','화석','가스','알코올','바이오','합성','무탄소'];
 $('#cats').innerHTML=cs.map(c=>`<button class="${c==cat?'g':''}" data-c="${c}">${c}</button>`).join('');const q=$('#q').value.trim().toLowerCase();
 $('#dg').innerHTML=FD.map((f,i)=>({f,i})).filter(x=>(cat=='전체'||x.f.c==cat)&&(x.f.n+x.f.f).toLowerCase().includes(q)).map(x=>`<div class="fc" data-i="${x.i}"><b>${x.i+1}. ${x.f.n}</b><div class="fm">${x.f.f}</div><div style="font-size:12px;color:#8cd">${x.f.c} · ${x.f.s}</div></div>`).join('')}
$('#q').oninput=renderDex;$('#cats').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;renderDex()}};
$('#dg').onclick=e=>{const c=e.target.closest('.fc');if(c){$('#md').innerHTML=det(FD[+c.dataset.i]);$('#mod').classList.add('on')}};
$('#mc').onclick=()=>$('#mod').classList.remove('on');
newMatch();
</script></body></html>
