$('#dg').onclick=e=>{const c=e.target.closest('.fc');if(c){$('#md').innerHTML=det(FD[+c.dataset.i]);$('#mod').classList.add('on')}};
$('#mc').onclick=()=>$('#mod').classList.remove('on');

// ===== Supabase 연동 (SB_URL / SB_KEY 만 본인 값으로 교체. service_role 키는 절대 넣지 마세요) =====
const SB_URL='https://YOUR-PROJECT.supabase.co',SB_KEY='YOUR_ANON_KEY',DOM='@ocean.game',PW=p=>p+'~ocean';
const CONF=!SB_URL.includes('YOUR'),ID_RE=/^20[1-7](0[1-9]|1\d|20)$/,QS=['첫 반려동물 이름은?','태어난 도시는?','가장 좋아하는 바다는?','졸업한 초등학교는?'];
let USER=null,SES=null,SET={speed:1,maint:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),msg=t=>{$('#am').textContent=t};
async function sb(path,o={}){if(!CONF)throw new Error('Supabase 설정이 필요합니다.');
 if(SES&&Date.now()>SES.exp&&!o.r){const rt=SES.refresh_token;SES=null;try{saveSes(await sb('/auth/v1/token?grant_type=refresh_token',{m:'POST',b:{refresh_token:rt},r:1}))}catch(e){logout();throw e}}
 const r=await fetch(SB_URL+path,{method:o.m||'GET',headers:{apikey:SB_KEY,'Content-Type':'application/json',Authorization:'Bearer '+(SES?SES.access_token:SB_KEY),...(o.h||{})},body:o.b?JSON.stringify(o.b):undefined});
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch{j=t}
 if(!r.ok)throw new Error((j&&(j.message||j.msg||j.error_description||j.error))||'요청 실패');return j}
const rpc=(f,b)=>sb('/rest/v1/rpc/'+f,{m:'POST',b:b||{}});
function saveSes(j){SES={access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+j.expires_in*1000-60000};localStorage.setItem('oceanSes',JSON.stringify(SES))}
async function restore(){try{SES=JSON.parse(localStorage.getItem('oceanSes'));if(!SES)return false;return await loadUser()}catch(e){SES=null;return false}}
async function loadUser(){const u=await sb('/auth/v1/user');const p=(await sb('/rest/v1/profiles?id=eq.'+u.id+'&select=*'))[0];if(!p)throw 0;
 if(p.banned){await logout();msg('정지된 계정입니다. 관리자에게 문의하세요.');return false}
 USER=p;pts=p.points;await loadMeta();enter();return true}
async function loadMeta(){try{(await sb('/rest/v1/settings?select=*')).forEach(r=>SET[r.key]=r.value);(await sb('/rest/v1/fuel_overrides?select=*')).forEach(r=>FD[r.idx]&&Object.assign(FD[r.idx],r.data));
 const n=await sb('/rest/v1/notices?select=*&order=created_at.desc&limit=3');$('#nt').innerHTML=n.map(x=>`<div class="pn" style="margin-bottom:6px">📢 <b>${esc(x.title)}</b> ${esc(x.body)}</div>`).join('')}catch(e){}}
function enter(){$('#usr').textContent=USER?USER.uid+(USER.role=='admin'?' 👑':''):'게스트';$('#lo').hidden=false;$('#adb').hidden=!(USER&&USER.role==='admin');newMatch();show('ready')}
async function logout(){try{if(SES)await sb('/auth/v1/logout',{m:'POST',r:1})}catch{}SES=null;USER=null;localStorage.removeItem('oceanSes');pts=+localStorage.getItem('oceanPts')||0;$('#lo').hidden=$('#adb').hidden=true;$('#usr').textContent='';upPts();show('auth');renderAuth('in')}
function renderAuth(t){const q=`<select id="fq">${QS.map(x=>`<option>${x}</option>`).join('')}</select>`,id='<input id="fi" inputmode="numeric" maxlength="7" placeholder="아이디">';
 $('#af').innerHTML={in:id+'<input id="fp" type="password" placeholder="비밀번호"><button class="g" data-do="in">로그인</button><div style="font-size:12px;color:#8cd;margin-top:6px">비밀번호를 잊으셨다면 관리자에게 문의하세요.</div>',
 up:id+'<div style="font-size:12px;color:#8cd">형식: 20 + (1~7) + (01~20) 예) 20105</div><input id="fp" type="password" placeholder="비밀번호 (4자리 이상)"><input id="fp2" type="password" placeholder="비밀번호 확인">'+'<button class="g" data-do="up">가입하기</button>',
 rs:id+q+'<input id="fa" placeholder="가입 때 입력한 답변"><input id="fp" type="password" placeholder="새 비밀번호 (4자리 이상)"><input id="fp2" type="password" placeholder="새 비밀번호 확인"><button class="g" data-do="rs">재설정</button>'}[t];msg('')}
$('#atab').onclick=e=>e.target.dataset.t&&renderAuth(e.target.dataset.t);
$('#af').onclick=async e=>{const d=e.target.dataset.do;if(!d)return;const id=$('#fi').value.trim(),pw=$('#fp').value;
 if(!(ID_RE.test(id)||d=='in'&&id=='lgh0221'))return msg('아이디는 20 + (1~7) + (01~20) 형식의 5자리 숫자입니다.');
 if(!CONF)return msg('Supabase 설정이 필요합니다. index.html 상단의 SB_URL, SB_KEY를 입력하세요.');
 try{if(d=='in'){if(await rpc('login_gate',{p_uid:id}))return msg('로그인 시도 초과: 15분 후 다시 시도하세요.');
   let j;try{j=await sb('/auth/v1/token?grant_type=password',{m:'POST',b:{email:id+DOM,password:PW(pw)}})}catch(x){await rpc('login_report',{p_uid:id,p_ok:false});throw new Error('아이디 또는 비밀번호가 올바르지 않습니다.')}
   await rpc('login_report',{p_uid:id,p_ok:true});saveSes(j);await loadUser();return}
  if(pw.length<4)return msg('비밀번호는 4자리 이상이어야 합니다.');if(pw!==$('#fp2').value)return msg('비밀번호가 일치하지 않습니다.');
  if(d=='up'){try{await sb('/auth/v1/signup',{m:'POST',b:{email:id+DOM,password:PW(pw)}})}catch(x){return msg(/already|registered|exists/i.test(x.message)?'이미 사용 중인 아이디입니다.':'가입 실패: '+x.message)}renderAuth('in');msg('가입 완료! 로그인해 주세요.')}
  else{const q=$('#fq').value,a=$('#fa').value.trim(),ok=await rpc('reset_pw',{p_uid:id,p_q:q,p_ans:a,p_new:PW(pw)});renderAuth('in');msg(ok?'비밀번호가 재설정되었습니다. 로그인해 주세요.':'아이디 또는 답변이 올바르지 않습니다.')}
 }catch(x){msg(/locked/.test(x.message)?'시도 횟수 초과: 15분 후 다시 시도하세요.':x.message)}};
$('#lo').onclick=()=>logout();$('#adb').onclick=()=>{show('adm');renderAdmin()};$('#aback').onclick=()=>show('ready');
// ===== 관리자 (모든 권한은 서버 RLS/RPC에서 검증. 화면 숨김은 편의일 뿐) =====
const AT=[['m','회원'],['s','통계'],['n','공지'],['g','운영 설정'],['f','연료'],['l','활동 기록']];let atab='m';
async function renderAdmin(t){atab=t||atab;$('#atabs').innerHTML=AT.map(x=>`<button class="${x[0]==atab?'g':''}" data-t="${x[0]}">${x[1]}</button>`).join('');const b=$('#abody');b.innerHTML='불러오는 중...';
 try{await({m:aMem,s:aStat,n:aNot,g:aSet,f:aFuel,l:aLog})[atab](b)}catch(e){b.innerHTML='오류: '+esc(e.message)}}
async function aMem(b,q){const l=await sb('/rest/v1/profiles?select=id,uid,points,role,banned,created_at&order=uid'+(q?'&uid=like.*'+q+'*':''));
 b.innerHTML=`<input id="aq" placeholder="아이디 검색" value="${esc(q||'')}" style="width:60%"><button data-a="srch">검색</button> 총 ${l.length}명<div style="overflow:auto"><table><tr><th>아이디</th><th>가입일</th><th>포인트</th><th>상태</th><th>관리</th></tr>${l.map(p=>`<tr><td>${p.uid}${p.role=='admin'?' 👑':''}</td><td>${p.created_at.slice(0,10)}</td><td>${p.points.toLocaleString()}</td><td>${p.banned?'🚫 정지':'정상'}</td><td><button data-a="pt" data-u="${p.uid}">포인트</button><button data-a="ban" data-u="${p.uid}" data-b="${p.banned?0:1}">${p.banned?'해제':'정지'}</button><button data-a="rec" data-i="${p.id}" data-u="${p.uid}">기록</button></td></tr>`).join('')}</table></div>`}
async function aStat(b){const s=await rpc('admin_stats');b.innerHTML=`<div class="dg"><div class="fc">👥 전체 회원<br><b>${s.users}</b></div><div class="fc">🚫 정지 회원<br><b>${s.banned}</b></div><div class="fc">🏁 완료된 경주<br><b>${s.races}</b></div><div class="fc">💰 회원 보유 포인트 합계<br><b>${Number(s.points).toLocaleString()}</b></div></div><p>순위 분포: ${[1,2,3,4,5].map(i=>i+'위 '+(s.ranks[i]||0)).join(' · ')}</p><p>인기 연료: ${s.fuels.map(f=>esc(f.fuel)+' '+f.c).join(', ')||'-'}</p>`}
async function aNot(b){const n=await sb('/rest/v1/notices?select=*&order=created_at.desc');b.innerHTML=`<input id="nti" placeholder="공지 제목" maxlength="60"><input id="ntb" placeholder="내용" maxlength="200"><button data-a="nadd">공지 등록</button>${n.map(x=>`<div class="sl"><b>${esc(x.title)}</b> ${esc(x.body)} <button data-a="ndel" data-i="${x.id}">삭제</button></div>`).join('')}`}
async function aSet(b){const rw=SET.rewards||[10000,5000,2000];b.innerHTML=`속도 배율 <input id="sx" type="number" step="0.1" value="${SET.speed||1}">보상 1·2·3위 <input id="r1" type="number" value="${rw[0]}"><input id="r2" type="number" value="${rw[1]}"><input id="r3" type="number" value="${rw[2]}"><label><input type="checkbox" id="sm" ${SET.maint?'checked':''} style="width:auto"> 점검 모드 (일반 회원 경주 중지)</label><br><button data-a="sset">저장</button>`}
async function aFuel(b){b.innerHTML=`<select id="fs">${FD.map((f,i)=>`<option value="${i}">${i+1}. ${esc(f.n)}</option>`).join('')}</select><textarea id="ft" rows="10" style="width:100%;background:#021a30;color:#fff"></textarea><div style="font-size:12px">a 특징 · p 장점 · d 단점 · u 활용현황 · h 선박 특징</div><button data-a="fsave">저장</button>`;const fl=()=>{const f=FD[$('#fs').value];$('#ft').value=JSON.stringify({a:f.a,p:f.p,d:f.d,u:f.u,h:f.h},null,1)};$('#fs').onchange=fl;fl()}
async function aLog(b){const l=await sb('/rest/v1/admin_log?select=*&order=created_at.desc&limit=80');b.innerHTML=`<div style="overflow:auto"><table><tr><th>시각</th><th>관리자</th><th>작업</th><th>대상</th><th>내용</th></tr>${l.map(x=>`<tr><td>${x.created_at.slice(0,16).replace('T',' ')}</td><td>${esc(x.admin_uid)}</td><td>${esc(x.action)}</td><td>${esc(x.target)}</td><td>${esc(x.detail)}</td></tr>`).join('')}</table></div>`}
$('#adm').onclick=async e=>{const d=e.target.dataset;if(d.t)return renderAdmin(d.t);if(!d.a)return;
 try{if(d.a=='srch')return aMem($('#abody'),$('#aq').value.replace(/\D/g,''));
  if(d.a=='pt'){const n=parseInt(prompt(d.u+' 포인트 변경량 (지급: 양수, 차감: 음수)'));if(!n)return;const r=prompt('변경 사유 (필수)');if(!r||r.trim().length<2)return alert('사유를 입력하세요.');
   if(!confirm(`${d.u}님에게 ${n>0?'+':''}${n}P ${n>0?'지급':'차감'}합니다.\n사유: ${r}\n진행할까요?`))return;alert('완료. 현재 '+await rpc('admin_adjust_points',{p_uid:d.u,p_delta:n,p_reason:r})+'P');renderAdmin()}
  if(d.a=='ban'&&confirm(d.u+(d.b=='1'?' 계정을 정지할까요?':' 계정 정지를 해제할까요?'))){await rpc('admin_set_ban',{p_uid:d.u,p_ban:d.b=='1'});renderAdmin()}
  if(d.a=='rec'){const rs=await sb('/rest/v1/races?user_id=eq.'+d.i+'&status=eq.done&order=created_at.desc&limit=30&select=*'),pl=await sb('/rest/v1/point_log?user_id=eq.'+d.i+'&order=created_at.desc&limit=20&select=*');
   $('#md').innerHTML=`<h3>${d.u} 경주 기록</h3>${rs.map(r=>`<p>${r.created_at.slice(0,16).replace('T',' ')} · ${r.rank}위 · ${esc(r.fuel)} · +${r.points}P</p>`).join('')||'<p>기록 없음</p>'}<h3>포인트 내역</h3>${pl.map(r=>`<p>${r.created_at.slice(0,16).replace('T',' ')} · ${r.delta>0?'+':''}${r.delta}P · ${esc(r.reason)}${r.admin_uid?' ('+r.admin_uid+')':''}</p>`).join('')||'<p>내역 없음</p>'}`;$('#mod').classList.add('on')}
  if(d.a=='nadd'){const t=$('#nti').value.trim();if(!t)return;await sb('/rest/v1/notices',{m:'POST',b:{title:t,body:$('#ntb').value.trim()}});renderAdmin()}
  if(d.a=='ndel'&&confirm('공지를 삭제할까요?')){await sb('/rest/v1/notices?id=eq.'+d.i,{m:'DELETE'});renderAdmin()}
  if(d.a=='sset'){const v={speed:Math.min(3,Math.max(.5,+$('#sx').value||1)),maint:$('#sm').checked,rewards:[+$('#r1').value||0,+$('#r2').value||0,+$('#r3').value||0,0,0]};
   await sb('/rest/v1/settings?on_conflict=key',{m:'POST',h:{Prefer:'resolution=merge-duplicates'},b:Object.entries(v).map(([key,value])=>({key,value}))});Object.assign(SET,v);alert('저장되었습니다.')}
  if(d.a=='fsave'){const i=+$('#fs').value,o=JSON.parse($('#ft').value),dt={};'apdhu'.split('').forEach(k=>{if(typeof o[k]=='string')dt[k]=o[k].slice(0,400)});
   await sb('/rest/v1/fuel_overrides?on_conflict=idx',{m:'POST',h:{Prefer:'resolution=merge-duplicates'},b:{idx:i,data:dt}});Object.assign(FD[i],dt);alert('저장되었습니다.')}
 }catch(err){alert(err.message)}};
newMatch();show('auth');renderAuth('in');if(CONF)restore();else msg('Supabase 설정이 필요합니다. index.html 상단의 SB_URL, SB_KEY를 입력하세요.');

</script></body></html>
